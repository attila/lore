# Lint for the human-facing documents. Prose rules live in .vale/styles/Guide,
# a copy of the agentic-workspace repository's style with one change: an aside
# may open with a bold question as its label. The word budget is a separate
# check, bin/lint-docs-budget.
#
# CHANGELOG.md is not linted: its released entries predate the style and are
# not rewritten. The plugin skills are instructions for an agent, not documents
# for a reader, so they are not linted either.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[{README,CONTRIBUTING,SECURITY,ROADMAP}.md]
BasedOnStyles = Guide

[docs/*.md]
BasedOnStyles = Guide

[.vale/fixtures/violations.md]
BasedOnStyles = Guide
